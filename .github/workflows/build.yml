name: Build

on:
  push:
    branches:
      - main
      - next
      - maint/**
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # releases only from release branches, the others run semantic-release as a dry run
  DRY_RUN: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # node and pnpm come from the setup action, so `mise exec` must not
      # install them again
      MISE_EXEC_AUTO_INSTALL: 'false'

    steps:
      - uses: containerbase/internal-tools/setup@2082203142ae62859ac4a86919258077c6460403 # v5.3.12
        with:
          save-cache: true
          pnpm-cache: |
            node_modules
            packages/*/node_modules

      - run: pnpm build

      - run: pnpm oxlint --format github

      - run: pnpm oxfmt --check

      - name: Install the workflow linters
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: jactionlint shellcheck zizmor

      - name: Check workflow files
        run: mise exec -- jactionlint --color

      - name: Run zizmor
        run: mise exec -- zizmor --format github .github/
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
          - 26

    permissions:
      id-token: write # required for codecov OIDC

    env:
      NODE_OPTIONS: --trace-warnings

    steps:
      - uses: containerbase/internal-tools/setup@2082203142ae62859ac4a86919258077c6460403 # v5.3.12
        with:
          save-cache: true
          node-version: ${{ matrix.node-version }}
          pnpm-cache: |
            node_modules
            packages/*/node_modules

      - run: pnpm build

      - run: pnpm test:unit

      - run: pnpm test:integration

      - name: Codecov test results
        if: github.event_name != 'merge_group' && !cancelled()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          use_oidc: true
          report_type: test_results
          flags: node${{ matrix.node-version }}-${{ runner.os }}

      - name: Codecov coverage results
        if: github.event_name != 'merge_group'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          use_oidc: true
          flags: node${{ matrix.node-version }}-${{ runner.os }}

  release:
    needs:
      - lint
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      # full checkout for semantic-release, which pushes with its own token
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # zero stands for full checkout, which is required for semantic-release
          filter: blob:none # we don't need all blobs, only the full tree
          show-progress: false

      - uses: containerbase/internal-tools/setup@2082203142ae62859ac4a86919258077c6460403 # v5.3.12
        with:
          checkout: false
          pnpm-cache: |
            node_modules
            packages/*/node_modules

      - run: pnpm build

      - run: pnpm semantic-release --dry-run "${DRY_RUN}" --ci "${CI_MODE}"
        env:
          CI_MODE: ${{ env.DRY_RUN != 'true' }}
          GITHUB_TOKEN: ${{ github.token }}

      # clients download the database from the latest release, so a package release must not become the latest one
      - name: Publish the release without marking it as latest
        if: env.DRY_RUN == 'false'
        run: |
          tag=$(git tag --points-at HEAD --list '[0-9]*.[0-9]*.[0-9]*')
          if [[ -n "$tag" ]]; then
            gh release edit "$tag" --draft=false --latest=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Catch-all required check for test matrix
  success:
    needs:
      - lint
      - test
      - release
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    if: always()
    steps:
      - name: Fail for failed or cancelled lint tests
        if: |
          needs.lint.result == 'failure' ||
          needs.lint.result == 'cancelled'
        run: exit 1

      - name: Fail for failed or cancelled test tests
        if: |
          needs.test.result == 'failure' ||
          needs.test.result == 'skipped'
        run: exit 1

      - name: Fail for failed or skipped release job
        if: |
          needs.release.result == 'failure' ||
          needs.release.result == 'skipped'
        run: exit 1
